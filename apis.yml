name: Andrenam
description: 'Andrenam is a defense technology company building an AI-powered maritime
  sensing network for undersea surveillance. It develops mass-manufacturable, low-cost
  buoy-based autonomous sonar systems that deploy from manned and unmanned vessels
  to detect, track, and identify real-time maritime traffic using cloud and edge AI,
  then dispatch resources to priority areas. Its product line spans deployment, AI-enhanced
  detection, and integration with naval command-and-control systems, targeting government
  and military maritime-domain-awareness customers. No public API, developer portal,
  or documentation surface is currently published.'
